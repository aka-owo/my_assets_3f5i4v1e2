<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>でかメモ</title>
    <link rel="apple-touch-icon" href="apple-touch-icon_n.png">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-muted: #657786;
            --border-color: #e1e8ed;
            --accent-color: #E6B101;
            --accent-hover: #cc9d01;
            --hover-bg: rgba(0, 0, 0, 0.03);
            --modal-bg: #f5f8fa;
            --success-color: #17bf63;
            --col-ext-green: #70A940;
            --col-ext-purple: #846E9D;
            --col-ext-yellow: #E6B101;
            --col-ext-red: #CF5758;
            --col-ext-blue: #8AABCC;

            /* 文字サイズ設定（初期値：中） */
            --content-font-size: 1.8rem;
            --content-line-height: 1.55;
        }

        body.font-small { --content-font-size: 1.25rem; --content-line-height: 1.45; }
        body.font-medium { --content-font-size: 1.8rem; --content-line-height: 1.5; }
        body.font-large { --content-font-size: 2.6rem; --content-line-height: 1.5; }
        body.font-xlarge { --content-font-size: 3.3rem; --content-line-height: 1.5; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 600px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        .header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            min-height: 48px;
            box-sizing: border-box;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60%;
        }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ボタン感を排除した星専用のスタイル */
        .star-btn {
            background: none;
            border: none;
            padding: 2px 4px;
            margin: 0;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            user-select: none;
            outline: none;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .star-btn.star-yellow {
            color: var(--col-ext-yellow);
        }

        .star-btn.star-green {
            color: var(--col-ext-green);
        }

        /* 選択されている（アクティブ）星の強調表示 */
        .star-btn.active {
            opacity: 1.0;
            transform: scale(1.15);
        }

        .btn-sub {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .btn-sub:hover {
            background: var(--hover-bg);
        }

        /* コピー成功時のボタン状態 */
        .btn-sub.copied {
            background-color: var(--success-color) !important;
            border-color: var(--success-color) !important;
            color: #ffffff !important;
        }

        /* モーダル共通 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1rem;
        }

        .modal-textarea {
            width: 100%;
            height: 100px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 8px;
            font-size: 16px;
            font-family: monospace;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* --- エディットモード固有のレイアウト --- */
        #editSection {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .toolbar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-input {
            width: 100%;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 8px 12px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        .title-input:focus {
            border-color: var(--accent-color);
        }

        .font-size-buttons {
            display: flex;
            gap: 6px;
        }

        .font-size-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .font-size-btn.active {
            border-color: var(--accent-color);
            background-color: rgba(230, 177, 1, 0.1);
            color: #b38800;
            font-weight: bold;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            border-color: var(--col-ext-blue);
            background-color: rgba(138, 171, 204, 0.15);
            color: #2b547e;
            font-weight: bold;
        }

        .editor-container {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea.main-editor {
            width: 100%;
            flex: 1;
            min-height: 250px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        textarea.main-editor::placeholder {
            color: var(--text-muted);
        }

        .actions-section {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .actions-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .hash-box-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .hash-input {
            flex: 1;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            padding: 6px 8px;
            font-size: 14px;
            font-family: monospace;
            height: 34px;
            box-sizing: border-box;
            resize: none;
        }

        /* --- プレビューモード固有のレイアウト --- */
        #previewSection {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .preview-top-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #444;
            background: #f0f4f8;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 18px;
            margin: 0 auto 24px auto;
            width: fit-content;
        }

        .arrow-icon {
            font-size: 0.8rem;
            color: #555;
            display: inline-block;
            transform: translateY(1px);
        }

        .preview-content {
            font-size: var(--content-font-size);
            line-height: var(--content-line-height);
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .preview-bottom-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.2rem;
            color: #2b547e;
            background-color: rgba(138, 171, 204, 0.12);
            border: 1px solid var(--col-ext-blue);
            border-radius: 12px;
            padding: 12px 20px;
            margin-top: 40px;
            font-weight: bold;
            text-align: center;
        }

        .footer {
            padding: 20px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body class="font-medium">

<div class="container">
    <!-- ヘッダー -->
    <div class="header">
        <div id="headerTitle" class="header-title"></div>
        <div class="header-btns">
            <button id="btnEditMode" class="star-btn star-yellow active" onclick="switchMode('edit')">★</button>
            <button id="btnPreviewMode" class="star-btn star-green" onclick="switchMode('preview')">★</button>
        </div>
    </div>

    <!-- ハッシュ読込モーダル -->
    <div id="loadModal" class="modal">
        <div class="modal-content">
            <h3>コードから読み込む</h3>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0;">共有されたコードをここに貼り付けてください。</p>
            <textarea id="modalHashInput" class="modal-textarea" placeholder="コードをペースト..."></textarea>
            <div class="modal-buttons">
                <button class="btn-sub" onclick="closeLoadModal()">キャンセル</button>
                <button class="btn-sub" style="border-color:var(--accent-color); color:#b38800;" onclick="applyHashFromModal()">読み込む</button>
            </div>
        </div>
    </div>

    <!-- エディットモード -->
    <div id="editSection">
        <div class="toolbar">
            <input type="text" id="titleInput" class="title-input" placeholder="タイトル（任意）" oninput="onTitleChanged()">
            <div class="toolbar-row">
                <div class="toolbar-group">
                    <span style="font-size: 0.85rem; color: var(--text-muted);">文字サイズ:</span>
                    <div class="font-size-buttons">
                        <button class="font-size-btn" data-size="small" onclick="setFontSize('small')">小</button>
                        <button class="font-size-btn active" data-size="medium" onclick="setFontSize('medium')">中</button>
                        <button class="font-size-btn" data-size="large" onclick="setFontSize('large')">大</button>
                        <button class="font-size-btn" data-size="xlarge" onclick="setFontSize('xlarge')">特大</button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <button id="toggleScrollMsgBtn" class="toggle-btn active" onclick="toggleScrollNotice()">スクロール指示: ON</button>
                </div>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="mainInput" class="main-editor" placeholder="ここに文字を入力してください..." oninput="onInputChanged()"></textarea>
        </div>

        <div class="actions-section">
            <div class="actions-buttons">
                <button class="btn-sub" onclick="exportFile()">ファイル保存</button>
                <button class="btn-sub" onclick="document.getElementById('fileInput').click()">ファイル読込</button>
                <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importFile(event)">
                <button class="btn-sub" onclick="openLoadModal()">コード読込</button>
                <!-- 追加したボタン（編集画面だけで表示） -->
                <button class="btn-sub" onclick="onCustomAction()">追加ボタン</button>
            </div>
            <div class="hash-box-wrapper">
                <textarea id="hashDisplay" class="hash-input" readonly placeholder="共有用コード"></textarea>
                <button id="copyBtn" class="btn-sub" style="border-radius: 8px; padding: 6px 12px;" onclick="copyHash()">コピー</button>
            </div>
        </div>
    </div>

    <!-- プレビューモード -->
    <div id="previewSection">
        <div id="previewTopMsg" class="preview-top-msg">
            <span class="arrow-icon">▼</span>
            <span>一番下まで読んでください</span>
            <span class="arrow-icon">▼</span>
        </div>
        <div id="previewContent" class="preview-content"></div>
        <div class="preview-bottom-msg">
            <span>✓</span>
            <span>以上です</span>
        </div>
    </div>

    <!-- フッター（エディット時のみ表示） -->
    <div id="footerArea" class="footer">
        &copy; 2026 でかメモ
    </div>
</div>

<script>
    let appData = {
        title: "",
        text: "",
        fontSize: "medium",
        showScrollNotice: true
    };
    let currentMode = "edit";

    window.onload = function() {
        loadFromHash();
        updateUI();
    };

    window.onhashchange = function() {
        loadFromHash();
        updateUI();
    };

    function switchMode(mode) {
        currentMode = mode;
        const editSec = document.getElementById('editSection');
        const prevSec = document.getElementById('previewSection');
        const footerArea = document.getElementById('footerArea');
        const btnEdit = document.getElementById('btnEditMode');
        const btnPrev = document.getElementById('btnPreviewMode');

        if (mode === 'edit') {
            document.body.classList.remove('mode-preview');
            editSec.style.display = 'flex';
            prevSec.style.display = 'none';
            footerArea.style.display = 'block';
            
            btnEdit.classList.add('active');
            btnPrev.classList.remove('active');
        } else {
            document.body.classList.add('mode-preview');
            editSec.style.display = 'none';
            prevSec.style.display = 'flex';
            footerArea.style.display = 'none';
            
            btnEdit.classList.remove('active');
            btnPrev.classList.add('active');

            // プレビューの内容・表示制御を反映
            document.getElementById('previewContent').textContent = appData.text;
            const topMsg = document.getElementById('previewTopMsg');
            topMsg.style.display = appData.showScrollNotice ? 'flex' : 'none';

            window.scrollTo(0, 0);
        }
    }

    function setFontSize(size) {
        appData.fontSize = size;
        updateFontSizeClass();

        const buttons = document.querySelectorAll('.font-size-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-size') === size) {
                btn.classList.add('active');
            }
        });
        saveToHash();
    }

    function updateFontSizeClass() {
        const size = appData.fontSize || 'medium';
        const classes = Array.from(document.body.classList).filter(c => !c.startsWith('font-'));
        classes.push('font-' + size);
        document.body.className = classes.join(' ');
    }

    function toggleScrollNotice() {
        appData.showScrollNotice = !appData.showScrollNotice;
        updateScrollNoticeBtn();
        saveToHash();
    }

    function updateScrollNoticeBtn() {
        const btn = document.getElementById('toggleScrollMsgBtn');
        if (appData.showScrollNotice) {
            btn.textContent = "スクロール指示: ON";
            btn.classList.add('active');
        } else {
            btn.textContent = "スクロール指示: OFF";
            btn.classList.remove('active');
        }
    }

    function onTitleChanged() {
        appData.title = document.getElementById('titleInput').value;
        updateHeaderTitle();
        saveToHash();
    }

    function onInputChanged() {
        appData.text = document.getElementById('mainInput').value;
        saveToHash();
    }

    function updateHeaderTitle() {
        const headerTitle = document.getElementById('headerTitle');
        headerTitle.textContent = appData.title || "";
    }

    function loadFromHash() {
        try {
            const hash = location.hash.substring(1);
            if (!hash) {
                appData = { title: "", text: "", fontSize: "medium", showScrollNotice: true };
                applyDataToDOM();
                return;
            }
            const jsonStr = decodeURIComponent(escape(atob(hash)));
            const parsed = JSON.parse(jsonStr);
            
            if (typeof parsed === 'string') {
                appData = { title: "", text: parsed, fontSize: "medium", showScrollNotice: true };
            } else {
                appData = {
                    title: parsed.title || "",
                    text: parsed.text || "",
                    fontSize: parsed.fontSize || "medium",
                    showScrollNotice: parsed.showScrollNotice !== undefined ? parsed.showScrollNotice : true
                };
            }
            applyDataToDOM();
        } catch (e) {
            appData = { title: "", text: "", fontSize: "medium", showScrollNotice: true };
            applyDataToDOM();
        }
    }

    function applyDataToDOM() {
        document.getElementById('titleInput').value = appData.title || "";
        document.getElementById('mainInput').value = appData.text || "";
        updateHeaderTitle();
        updateFontSizeClass();
        
        // フォントサイズボタンの状態合わせ
        const currentSize = appData.fontSize || 'medium';
        const buttons = document.querySelectorAll('.font-size-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-size') === currentSize) {
                btn.classList.add('active');
            }
        });

        updateScrollNoticeBtn();
        updateHashDisplay(location.hash.substring(1));
    }

    function saveToHash() {
        try {
            const jsonStr = JSON.stringify(appData);
            const hash = btoa(unescape(encodeURIComponent(jsonStr)));
            location.hash = hash;
            updateHashDisplay(hash);
        } catch (e) {
            alert("データが長すぎるため、URLに保存できません。ファイル保存をご利用ください。");
        }
    }

    function updateHashDisplay(hash) {
        document.getElementById('hashDisplay').value = hash;
    }

    function copyHash() {
        const hashField = document.getElementById('hashDisplay');
        const copyBtn = document.getElementById('copyBtn');
        if (!hashField.value) {
            return;
        }
        navigator.clipboard.writeText(hashField.value).then(() => {
            copyBtn.textContent = "コピー完了";
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = "コピー";
                copyBtn.classList.remove('copied');
            }, 1500);
        });
    }

    function openLoadModal() {
        document.getElementById('modalHashInput').value = '';
        document.getElementById('loadModal').style.display = 'flex';
    }

    function closeLoadModal() {
        document.getElementById('modalHashInput').value = '';
        document.getElementById('loadModal').style.display = 'none';
    }

    function applyHashFromModal() {
        const newHash = document.getElementById('modalHashInput').value.trim();
        if (!newHash) return;
        location.hash = newHash;
        loadFromHash();
        closeLoadModal();
    }

    function exportFile() {
        const jsonStr = JSON.stringify(appData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `deka-memo-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (typeof data === 'string') {
                    appData.text = data;
                } else if (data && typeof data.text === 'string') {
                    appData = data;
                } else {
                    return;
                }
                saveToHash();
                applyDataToDOM();
            } catch (err) {
                // エラー時は何もしない
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // 追加したボタンの動作関数（必要に応じて書き換えてください）
    function onCustomAction() {
        alert("追加ボタンが押されました");
    }

    function updateUI() {
        // 初期状態の反映など
    }
</script>

</body>
</html>
