<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF14 ミラプリレシピ＆カララントメモ</title>
<!-- エオルゼアデータベース公式ツールチップスクリプト -->
<script src="https://img.finalfantasyxiv.com/lds/pc/global/js/eorzeadb/loader.js?v2"></script>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a1d; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 20px; color: #e3b04b; border-bottom: 2px solid #444; padding-bottom: 10px; }
  .controls { margin-bottom: 20px; display: flex; gap: 10px; }
  button { background: #e3b04b; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #111; }
  button:hover { background: #d29d38; }
  
  .card-container { display: flex; flex-wrap: wrap; gap: 20px; }
  .recipe-card { background: #2a2a30; border: 1px solid #444; border-radius: 8px; padding: 15px; width: 340px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .card-header { font-weight: bold; font-size: 16px; color: #e3b04b; margin-bottom: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 6px; }
  
  .slot { margin-bottom: 10px; position: relative; }
  .slot-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
  .input-row { display: flex; gap: 6px; align-items: center; }
  
  .item-preview { width: 32px; height: 32px; background: #111; border: 1px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .item-preview img { width: 100%; height: 100%; }
  
  input, select { background: #121214; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; }
  .item-input { flex: 1; }
  .dye-select { width: 130px; }
  
  .color-badge { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #fff; display: inline-block; flex-shrink: 0; }
  
  /* サジェストリスト */
  .suggest-list { position: absolute; top: 100%; left: 38px; right: 0; background: #222; border: 1px solid #e3b04b; z-index: 99; max-height: 150px; overflow-y: auto; list-style: none; padding: 0; margin: 0; display: none; }
  .suggest-item { padding: 6px 10px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .suggest-item:hover { background: #3e3f4a; color: #e3b04b; }
  .suggest-item img { width: 20px; height: 20px; }
</style>
</head>
<body>

<h1>FF14 ミラプリ装備＆カララントメモ</h1>

<div class="controls">
  <button onclick="addCard()">＋ 新しいメモカードを追加</button>
  <button onclick="saveAll()">ローカルに保存</button>
</div>

<div class="card-container" id="container"></div>

<script>
// 代表的なカララントとカラーコードの定義リスト
const DYES = [
  { name: "染色なし", hex: "transparent" },
  { name: "スノウホワイト", hex: "#E4E4E4" },
  { name: "ジェットブラック", hex: "#191919" },
  { name: "スートブラック", hex: "#2B2B2B" },
  { name: "ダラガブレッド", hex: "#781A1A" },
  { name: "ルビーレッド", hex: "#A81C1C" },
  { name: "オキュルトブルー", hex: "#1C3B5E" },
  { name: "ハニーイエロー", hex: "#E5B022" },
  { name: "シャインゴールド", hex: "#D4AF37" },
  { name: "ピュアホワイト", hex: "#FFFFFF" }
];

const SLOTS = ["武具", "頭防具", "胴防具", "手防具", "脚防具", "足防具"];
let cardCount = 0;

function createDyeOptionsHtml() {
  return DYES.map(d => `<option value="${d.name}" data-hex="${d.hex}">${d.name}</option>`).join('');
}

function addCard(data = null) {
  cardCount++;
  const cardId = cardCount;
  const card = document.createElement('div');
  card.className = 'recipe-card';
  card.id = `card-${cardId}`;

  let slotsHtml = '';
  SLOTS.forEach(slot => {
    slotsHtml += `
      <div class="slot">
        <div class="slot-label">${slot}</div>
        <div class="input-row">
          <div class="item-preview" id="preview-${cardId}-${slot}"></div>
          <input type="text" class="item-input" id="input-${cardId}-${slot}" placeholder="装備名を入力..." oninput="searchItem(this, '${cardId}', '${slot}')" autocomplete="off">
          <span class="color-badge" id="badge-${cardId}-${slot}" style="background: transparent;"></span>
          <select class="dye-select" onchange="updateDyeColor(this, '${cardId}', '${slot}')">
            ${createDyeOptionsHtml()}
          </select>
        </div>
        <ul class="suggest-list" id="suggest-${cardId}-${slot}"></ul>
      </div>
    `;
  });

  card.innerHTML = `
    <div class="card-header">
      <span>ミラプリメモ #${cardId}</span>
      <button style="font-size:10px; padding:2px 6px; background:#c94c4c; color:#fff;" onclick="removeCard(${cardId})">削除</button>
    </div>
    ${slotsHtml}
  `;

  document.getElementById('container').appendChild(card);
}

// Garland Tools APIを使ったリアルタイム検索
async function searchItem(inputEl, cardId, slot) {
  const query = inputEl.value.trim();
  const suggestList = document.getElementById(`suggest-${cardId}-${slot}`);
  
  if (query.length < 2) {
    suggestList.style.display = 'none';
    return;
  }

  try {
    const res = await fetch(`https://www.garlandtools.org/api/search.org.php?text=${encodeURIComponent(query)}&lang=ja`);
    const data = await res.json();
    const items = data.filter(d => d.type === 'item').slice(0, 5);

    suggestList.innerHTML = '';
    if (items.length > 0) {
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'suggest-item';
        const iconUrl = `https://www.garlandtools.org/db/icons/item/${item.obj.icon}.png`;
        li.innerHTML = `<img src="${iconUrl}"> <span>${item.obj.n}</span>`;
        
        li.onclick = () => {
          inputEl.value = item.obj.n;
          // 画像のセット
          document.getElementById(`preview-${cardId}-${slot}`).innerHTML = `<img src="${iconUrl}">`;
          suggestList.style.display = 'none';
        };
        suggestList.appendChild(li);
      });
      suggestList.style.display = 'block';
    }
  } catch(e) {
    console.error(e);
  }
}

// カララントの色変更反映
function updateDyeColor(selectEl, cardId, slot) {
  const selectedOption = selectEl.options[selectEl.selectedIndex];
  const hex = selectedOption.getAttribute('data-hex');
  document.getElementById(`badge-${cardId}-${slot}`).style.background = hex;
}

function removeCard(id) {
  document.getElementById(`card-${id}`).remove();
}

function saveAll() {
  alert('ブラウザにメモを保存しました。');
}

// 初期起動（1枚カードを作成）
addCard();
</script>
</body>
</html>
