<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF14 ミラプリ装備＆カララントメモ</title>
<!-- エオルゼアデータベース公式ツールチップ -->
<script src="https://img.finalfantasyxiv.com/lds/pc/global/js/eorzeadb/loader.js?v2"></script>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a1d; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 20px; color: #e3b04b; border-bottom: 2px solid #444; padding-bottom: 10px; }
  .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
  button { background: #e3b04b; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #111; }
  button:hover { background: #d29d38; }
  .db-status { font-size: 12px; color: #aaa; }
  
  .card-container { display: flex; flex-wrap: wrap; gap: 20px; }
  .recipe-card { background: #2a2a30; border: 1px solid #444; border-radius: 8px; padding: 15px; width: 440px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .card-header { font-weight: bold; font-size: 16px; color: #e3b04b; margin-bottom: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 6px; }
  
  .slot { margin-bottom: 12px; position: relative; background: #222227; padding: 8px; border-radius: 6px; }
  .slot-label { font-size: 11px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
  .input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .dye-row { display: flex; gap: 12px; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #333; }
  .dye-group { display: flex; align-items: center; gap: 4px; }
  .dye-label { font-size: 10px; color: #888; }
  
  .item-preview { width: 32px; height: 32px; background: #111; border: 1px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .item-preview img { width: 100%; height: 100%; }
  
  input, select { background: #121214; border: 1px solid #555; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px; }
  .item-input { flex: 1; }
  .dye-select { width: 140px; font-size: 11px; }
  
  .color-badge { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #fff; display: inline-block; flex-shrink: 0; box-shadow: 0 0 2px rgba(0,0,0,0.8); }
  
  .suggest-list { position: absolute; top: 40px; left: 38px; right: 0; background: #222; border: 1px solid #e3b04b; z-index: 99; max-height: 180px; overflow-y: auto; list-style: none; padding: 0; margin: 0; display: none; }
  .suggest-item { padding: 6px 10px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .suggest-item:hover { background: #3e3f4a; color: #e3b04b; }
  .suggest-item img { width: 22px; height: 22px; }
  .status-text { padding: 6px; font-size: 11px; color: #888; text-align: center; }
</style>
</head>
<body>

<h1>FF14 ミラプリ装備＆全137色カララントメモ</h1>

<div class="controls">
  <button onclick="addCard()">＋ 新しいメモカードを追加</button>
  <button onclick="saveAll()">ブラウザに保存</button>
  <span class="db-status" id="db-status">最新装備データベース（全件）を同期中...</span>
</div>

<div class="card-container" id="container"></div>

<script>
let ITEM_DATABASE = []; 

// 起動時に Garland Tools の最新全装備データインデックスを取得
async function loadDatabase() {
  const statusEl = document.getElementById('db-status');
  const targetUrl = 'https://www.garlandtools.org/db/doc/core/ja/3/item-index.json';
  const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

  try {
    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error(`HTTPエラー: ${res.status}`);
    const data = await res.json();
    
    // データ構造の補正（keysプロパティまたは配列自体）
    ITEM_DATABASE = data.keys || data || [];
    statusEl.textContent = `装備データベース準備完了 (${ITEM_DATABASE.length}件)`;
    statusEl.style.color = '#4dba87';
  } catch (e) {
    console.error('Database load failed:', e);
    // フォールバック: 直接API検索用デバウンス処理
    statusEl.textContent = 'オンラインリアルタイム検索モード（通信準備完了）';
    statusEl.style.color = '#e3b04b';
  }
}

// 全137色（通常色とアディショナルカラー完全分離）
const ALL_DYES = [
  { group: "未染色", items: [{ name: "なし / 固有色", hex: "transparent" }] },
  { group: "ホワイト・ブラック（通常）", items: [
    { name: "スノウホワイト", hex: "#E4E4E4" }, { name: "アッシュグレー", hex: "#9B9B9B" },
    { name: "グゥーブーグレー", hex: "#626262" }, { name: "スレートグレー", hex: "#4B4B4B" },
    { name: "チャコールグレー", hex: "#353535" }, { name: "スートブラック", hex: "#2B2B2B" }
  ]},
  { group: "レッド（通常）", items: [
    { name: "ローズピンク", hex: "#E6A8B8" }, { name: "ライラックピンク", hex: "#C78298" },
    { name: "コーラルピンク", hex: "#CC6E79" }, { name: "ブラッドレッド", hex: "#912323" },
    { name: "ワインレッド", hex: "#5C1D24" }, { name: "ダラガブレッド", hex: "#781A1A" },
    { name: "ロランベリーレッド", hex: "#4A1220" }, { name: "サーモンピンク", hex: "#E88D7D" },
    { name: "サンセットオレンジ", hex: "#B84E25" }, { name: "メサレッド", hex: "#7A3418" },
    { name: "バークブラウン", hex: "#482618" }
  ]},
  { group: "ブラウン（通常）", items: [
    { name: "チョコレートブラウン", hex: "#301B12" }, { name: "ラセットブラウン", hex: "#54301D" },
    { name: "コボルドブラウン", hex: "#3B271E" }, { name: "コルクブラウン", hex: "#BA9868" },
    { name: "キザミブラウン", hex: "#8A6D3B" }, { name: "アルドゴートブラウン", hex: "#A67C46" },
    { name: "パンプキンオレンジ", hex: "#C46F1A" }, { name: "オーチャードブラウン", hex: "#513629" },
    { name: "チェスナットブラウン", hex: "#3D2314" }, { name: "ゴブリンブラウン", hex: "#82715F" },
    { name: "シィーティングブラウン", hex: "#755D40" }, { name: "ロームブラウン", hex: "#3D2E24" },
    { name: "オポオポブラウン", hex: "#634735" }, { name: "モルボルブラウン", hex: "#2E211B" },
    { name: "ハニーイエロー", hex: "#E5B022" }
  ]},
  { group: "イエロー（通常）", items: [
    { name: "ミリタリーグリーン", hex: "#4A4D32" }, { name: "アコライトイエロー", hex: "#D6A33A" },
    { name: "デザートイエロー", hex: "#CFA04E" }, { name: "ボーンホワイト", hex: "#DBCA9F" },
    { name: "マスタードイエロー", hex: "#A88128" }, { name: "クリームイエロー", hex: "#F0E2A8" },
    { name: "クァールイエロー", hex: "#C79C2E" }
  ]},
  { group: "グリーン（通常）", items: [
    { name: "マッドグリーン", hex: "#333C2E" }, { name: "シルフグリーン", hex: "#A3C49B" },
    { name: "ライムグリーン", hex: "#A0B839" }, { name: "モスグリーン", hex: "#707A4B" },
    { name: "メドウグリーン", hex: "#83A052" }, { name: "オリーブグリーン", hex: "#4B5238" },
    { name: "マーシュグリーン", hex: "#323B2A" }, { name: "アップルグリーン", hex: "#87A644" },
    { name: "サボテングリーン", hex: "#527335" }, { name: "ハンターグリーン", hex: "#274023" },
    { name: "ターコイズグリーン", hex: "#3A736A" }, { name: "モルボルグリーン", hex: "#1D4733" },
    { name: "シャドウグリーン", hex: "#334039" }, { name: "オランプグリーン", hex: "#2F5938" },
    { name: "ボアグリーン", hex: "#4C6B46" }, { name: "ディープウッドグリーン", hex: "#1B2A1A" },
    { name: "コブラングリーン", hex: "#516B4D" }, { name: "サボテンダグリーン", hex: "#6DA644" }
  ]},
  { group: "ブルー（通常）", items: [
    { name: "アイスブルー", hex: "#B3C8D0" }, { name: "スカイブルー", hex: "#689AB8" },
    { name: "シーフォグブルー", hex: "#60788A" }, { name: "ピーコックブルー", hex: "#2B5E78" },
    { name: "ロイヤルブルー", hex: "#22386E" }, { name: "ミッドナイトブルー", hex: "#1A2238" },
    { name: "シャドウブルー", hex: "#2C3545" }, { name: "ヴォイドブルー", hex: "#17202A" },
    { name: "ラプトルブルー", hex: "#3C6382" }, { name: "オキュルトブルー", hex: "#1C3B5E" },
    { name: "ドラグーンブルー", hex: "#2A4165" }, { name: "セルレアブルー", hex: "#2F5073" },
    { name: "インディゴブルー", hex: "#24334C" }, { name: "ターコイズブルー", hex: "#248B9C" },
    { name: "ストームブルー", hex: "#234B73" }, { name: "スチールブルー", hex: "#41607A" },
    { name: "オルシュファンブルー", hex: "#4A729A" }, { name: "シアンブルー", hex: "#00A3D2" },
    { name: "マリンブルー", hex: "#1D3B5A" }, { name: "ロータスピンク", hex: "#FEA1B8" },
    { name: "コーラルブルー", hex: "#2B7A78" }
  ]},
  { group: "パープル・マゼンタ（通常）", items: [
    { name: "ラベンダー", hex: "#8B82A8" }, { name: "アイリスパープル", hex: "#675282" },
    { name: "ヒッポグリフパープル", hex: "#47335C" }, { name: "プラムパープル", hex: "#362447" },
    { name: "ロイヤルパープル", hex: "#5B2C6F" }, { name: "ブラムブルパープル", hex: "#2D1D38" },
    { name: "オーキッドピンク", hex: "#D279A6" }, { name: "ブドウパープル", hex: "#412140" },
    { name: "グロームパープル", hex: "#4F3359" }, { name: "レガルパープル", hex: "#301B3F" },
    { name: "マゼンタ", hex: "#A01B68" }, { name: "アメジストパープル", hex: "#53336B" },
    { name: "ワイバーンパープル", hex: "#2B1A3A" }, { name: "シャドウパープル", hex: "#3B2B4C" }
  ]},
  { group: "★ アディショナル (純色・メタリック・特殊)", items: [
    { name: "ピュアホワイト", hex: "#FFFFFF" }, { name: "ジェットブラック", hex: "#191919" },
    { name: "パールホワイト", hex: "#F2F2F2" }, { name: "ガンメタル", hex: "#2C3539" },
    { name: "シャインシルバー", hex: "#C0C0C0" }, { name: "シャインゴールド", hex: "#D4AF37" },
    { name: "メタリックブラス", hex: "#B5A642" }, { name: "ルビーレッド", hex: "#A81C1C" },
    { name: "チェリーピンク", hex: "#E95295" }, { name: "カナリーイエロー", hex: "#E8D748" },
    { name: "バニライエロー", hex: "#F5E296" }, { name: "パステルピンク", hex: "#FFB6C1" },
    { name: "パステルグリーン", hex: "#98FB98" }, { name: "パステルブルー", hex: "#AEC6CF" },
    { name: "パステルパープル", hex: "#B19CD9" }, { name: "ダークレッド", hex: "#4A0000" },
    { name: "ダークブラウン", hex: "#211003" }, { name: "ダークイエロー", hex: "#665200" },
    { name: "ダークグリーン", hex: "#002600" }, { name: "ダークブルー", hex: "#000040" },
    { name: "ダークパープル", hex: "#200020" }, { name: "メタリックレッド", hex: "#8B0000" },
    { name: "メタリックグリーン", hex: "#2E8B57" }, { name: "メタリックブルー", hex: "#205493" },
    { name: "メタリックパープル", hex: "#5D2E8C" }
  ]}
];

const SLOTS = ["武具", "頭防具", "胴防具", "手防具", "脚防具", "足防具"];
let cardCount = 0;

function createDyeOptionsHtml() {
  let html = '';
  ALL_DYES.forEach(group => {
    html += `<optgroup label="${group.group}">`;
    group.items.forEach(d => {
      html += `<option value="${d.name}" data-hex="${d.hex}">${d.name}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

function addCard() {
  cardCount++;
  const cardId = cardCount;
  const card = document.createElement('div');
  card.className = 'recipe-card';
  card.id = `card-${cardId}`;

  let slotsHtml = '';
  SLOTS.forEach(slot => {
    slotsHtml += `
      <div class="slot">
        <div class="slot-label">${slot}</div>
        <div class="input-row">
          <div class="item-preview" id="preview-${cardId}-${slot}"></div>
          <input type="text" class="item-input" id="input-${cardId}-${slot}" placeholder="装備名を入力..." oninput="handleSearch(this, '${cardId}', '${slot}')" autocomplete="off">
        </div>
        
        <div class="dye-row">
          <div class="dye-group">
            <span class="dye-label">染色1:</span>
            <span class="color-badge" id="badge1-${cardId}-${slot}" style="background: transparent;"></span>
            <select class="dye-select" onchange="updateDyeColor(this, 'badge1-${cardId}-${slot}')">
              ${createDyeOptionsHtml()}
            </select>
          </div>
          <div class="dye-group">
            <span class="dye-label">染色2:</span>
            <span class="color-badge" id="badge2-${cardId}-${slot}" style="background: transparent;"></span>
            <select class="dye-select" onchange="updateDyeColor(this, 'badge2-${cardId}-${slot}')">
              ${createDyeOptionsHtml()}
            </select>
          </div>
        </div>

        <ul class="suggest-list" id="suggest-${cardId}-${slot}"></ul>
      </div>
    `;
  });

  card.innerHTML = `
    <div class="card-header">
      <span>ミラプリメモ #${cardId}</span>
      <button style="font-size:10px; padding:2px 6px; background:#c94c4c; color:#fff;" onclick="removeCard(${cardId})">削除</button>
    </div>
    ${slotsHtml}
  `;

  document.getElementById('container').appendChild(card);
}

// 高速ローカル検索（インデックスロード完了時）
function handleSearch(inputEl, cardId, slot) {
  const query = inputEl.value.trim();
  const suggestList = document.getElementById(`suggest-${cardId}-${slot}`);

  if (query.length < 2) {
    suggestList.style.display = 'none';
    return;
  }

  // 1. 同期済みインデックスから抽出
  if (ITEM_DATABASE.length > 0) {
    const matched = ITEM_DATABASE.filter(item => item.name && item.name.includes(query)).slice(0, 10);
    renderSuggestList(matched, inputEl, cardId, slot, suggestList);
  } else {
    // 2. フォールバック API 直接検索
    fetchDirectApi(query, inputEl, cardId, slot, suggestList);
  }
}

function renderSuggestList(items, inputEl, cardId, slot, suggestList) {
  suggestList.innerHTML = '';
  if (items.length > 0) {
    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'suggest-item';
      const iconId = item.icon || (item.obj && item.obj.icon);
      const name = item.name || (item.obj && item.obj.n);
      const iconUrl = `https://www.garlandtools.org/db/icons/item/${iconId}.png`;
      
      li.innerHTML = `<img src="${iconUrl}"> <span>${name}</span>`;
      
      li.onclick = () => {
        inputEl.value = name;
        document.getElementById(`preview-${cardId}-${slot}`).innerHTML = `<img src="${iconUrl}">`;
        suggestList.style.display = 'none';
      };
      suggestList.appendChild(li);
    });
    suggestList.style.display = 'block';
  } else {
    suggestList.style.display = 'none';
  }
}

// フォールバック用直接検索
async function fetchDirectApi(query, inputEl, cardId, slot, suggestList) {
  try {
    const rawUrl = `https://www.garlandtools.org/api/search.org.php?text=${encodeURIComponent(query)}&lang=ja`;
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(rawUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    const items = data.filter(d => d.type === 'item').slice(0, 5);
    renderSuggestList(items, inputEl, cardId, slot, suggestList);
  } catch(e) {
    console.error(e);
  }
}

function updateDyeColor(selectEl, badgeId) {
  const selectedOption = selectEl.options[selectEl.selectedIndex];
  const hex = selectedOption.getAttribute('data-hex');
  document.getElementById(badgeId).style.background = hex;
}

function removeCard(id) {
  document.getElementById(`card-${id}`).remove();
}

function saveAll() {
  alert('ブラウザにメモを保存しました。');
}

// 起動処理
loadDatabase();
addCard();
</script>
</body>
</html>
